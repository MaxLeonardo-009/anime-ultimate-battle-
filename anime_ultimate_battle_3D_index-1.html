<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,orientation:landscape">
<title>Anime Ultimate Battle — 3D Combat Test 1.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;font-family:Arial,sans-serif;touch-action:none}
#game{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
.bar{position:absolute;top:18px;width:36%;height:20px;border:2px solid white;border-radius:12px;background:#222;overflow:hidden}
#pbar{left:3%} #ebar{right:3%}
.fill{height:100%;width:100%;background:#35e06f}.enemy{background:#ff4d55}
#buttons{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(2,70px);gap:10px;pointer-events:auto}
button{width:70px;height:58px;border-radius:18px;border:2px solid #fff;background:#151a28;color:#fff;font-weight:bold;font-size:12px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#202a48,#05060a);pointer-events:auto}
#start button{width:190px;height:70px;font-size:20px}
#joy{position:absolute;left:22px;bottom:22px;width:130px;height:130px;border:2px solid #aaa;border-radius:50%;background:#ffffff18;pointer-events:auto}
#knob{position:absolute;width:52px;height:52px;left:39px;top:39px;border-radius:50%;background:#ffffff55}
#title{position:absolute;top:50%;left:50%;transform:translate(-50%,-130px);font-size:28px;text-align:center;font-weight:900}
#hint{position:absolute;top:55%;left:50%;transform:translateX(-50%);opacity:.8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="title">ANIME ULTIMATE BATTLE<br><small>3D COMBAT TEST 1.0</small></div>
  <div id="hint">Move • Attack • Special • Block • Dodge • Ultimate</div>
  <div class="bar" id="pbar"><div class="fill" id="pf"></div></div>
  <div class="bar" id="ebar"><div class="fill enemy" id="ef"></div></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="buttons">
    <button data-a="attack">ATTACK</button><button data-a="special">SPECIAL</button>
    <button data-a="block">BLOCK</button><button data-a="dodge">DODGE</button>
    <button data-a="ultimate">ULTIMATE</button>
  </div>
  <div id="start"><button id="startBtn">START BATTLE</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const canvas=document.querySelector('#game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b18);
scene.fog=new THREE.Fog(0x070b18,18,70);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
camera.position.set(0,7,11);

scene.add(new THREE.HemisphereLight(0x9fb7ff,0x202020,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.5); sun.position.set(8,15,5); sun.castShadow=true; scene.add(sun);

const arena=new THREE.Mesh(new THREE.CylinderGeometry(10,10,1,48),new THREE.MeshStandardMaterial({color:0x30384b,roughness:.75}));
arena.receiveShadow=true; scene.add(arena);
const ring=new THREE.Mesh(new THREE.TorusGeometry(8.7,.12,12,64),new THREE.MeshBasicMaterial({color:0x55bfff}));
ring.rotation.x=Math.PI/2; ring.position.y=.55; scene.add(ring);

for(let i=0;i<12;i++){
 const a=i*Math.PI*2/12;
 const p=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.2,1.2),new THREE.MeshStandardMaterial({color:0x49526b}));
 p.position.set(Math.cos(a)*8,1.5,Math.sin(a)*8); p.rotation.y=a; p.castShadow=true; scene.add(p);
}

function fighter(color,x,z){
 const g=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({color,roughness:.45});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.62,1.5,6,12),mat);
 body.position.y=1.5; body.castShadow=true; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.55,20,16),mat);
 head.position.y=2.85; head.castShadow=true; g.add(head);
 const aura=new THREE.Mesh(new THREE.TorusGeometry(1.15,.06,8,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));
 aura.rotation.x=Math.PI/2; aura.position.y=.12; g.add(aura);
 g.position.set(x,0,z); scene.add(g); return g;
}
const player=fighter(0x4ea7ff,-3,2);
const enemy=fighter(0xff4b55,3,-1); enemy.rotation.y=Math.PI;

let running=false,pHP=100,eHP=100,moveX=0,moveY=0,last=performance.now(),attackTimer=0,invuln=0;

const pf=document.querySelector('#pf'),ef=document.querySelector('#ef');
const start=document.querySelector('#start'), title=document.querySelector('#title'), hint=document.querySelector('#hint');
document.querySelector('#startBtn').onclick=()=>{running=true;start.style.display='none';title.style.display='none';hint.style.display='none';};

function doAction(a){
 if(!running)return;
 if(a==='attack' && attackTimer<=0){
   attackTimer=.35;
   if(player.position.distanceTo(enemy.position)<3.2) eHP=Math.max(0,eHP-8);
 }
 if(a==='special' && attackTimer<=0){
   attackTimer=.8;
   if(player.position.distanceTo(enemy.position)<4.8) eHP=Math.max(0,eHP-15);
 }
 if(a==='ultimate' && attackTimer<=0){
   attackTimer=1.5;
   if(player.position.distanceTo(enemy.position)<6) eHP=Math.max(0,eHP-30);
 }
 if(a==='dodge') invuln=.5;
}
document.querySelectorAll('#buttons button').forEach(b=>b.onpointerdown=()=>doAction(b.dataset.a));

const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
function joyMove(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),max=48;
 if(m>max){dx*=max/m;dy*=max/m}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 moveX=dx/max;moveY=dy/max;
}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);joyMove(e)}
joy.onpointermove=e=>{if(e.buttons)joyMove(e)}
joy.onpointerup=joy.onpointercancel=()=>{moveX=moveY=0;knob.style.transform='translate(0,0)'};

function loop(t){
 requestAnimationFrame(loop); const dt=Math.min(.033,(t-last)/1000);last=t;
 attackTimer=Math.max(0,attackTimer-dt);invuln=Math.max(0,invuln-dt);
 if(running){
   player.position.x+=moveX*dt*5; player.position.z+=moveY*dt*5;
   player.position.x=THREE.MathUtils.clamp(player.position.x,-8,8);
   player.position.z=THREE.MathUtils.clamp(player.position.z,-8,8);
   player.lookAt(enemy.position.x,1.5,enemy.position.z);
   enemy.lookAt(player.position.x,1.5,player.position.z);
   const d=player.position.distanceTo(enemy.position);
   if(d>2.5){enemy.translateZ(dt*1.3)}
   else if(invuln<=0 && Math.random()<dt*.7)pHP=Math.max(0,pHP-4);
   if(eHP<=0 || pHP<=0){running=false;start.style.display='flex';document.querySelector('#startBtn').textContent=eHP<=0?'VICTORY — PLAY AGAIN':'DEFEAT — TRY AGAIN';}
 }
 const target=new THREE.Vector3(player.position.x,4.8,player.position.z+8.5);
 camera.position.lerp(target,1-Math.pow(.001,dt)); camera.lookAt(player.position.x,1.4,player.position.z);
 pf.style.width=pHP+'%';ef.style.width=eHP+'%';
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
