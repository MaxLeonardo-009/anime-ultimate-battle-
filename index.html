<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Anime Ultimate Battle — Test Run 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050713;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{width:100%;height:100%;display:block}.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,18,.78);z-index:5}
h1{font-size:clamp(30px,7vw,72px);margin:0 0 8px;text-align:center;text-shadow:0 0 25px #6d5cff}h2{margin:5px 0 25px;opacity:.8}
button{width:min(360px,78vw);margin:7px;padding:14px;border:1px solid #ffffff55;border-radius:12px;background:#171b38;color:#fff;font-size:18px;font-weight:bold}
button:hover{background:#2b2b60}.hidden{display:none!important}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}.bar{position:absolute;top:15px;width:35%;height:22px;border:2px solid white;border-radius:12px;background:#111;overflow:hidden}.bar div{height:100%}
#hp{left:3%}#ehp{right:3%}#pf{background:#20df8a}#ef{background:#ff4f68}
.lab{position:absolute;top:43px;font-weight:bold;text-shadow:2px 2px #000}#pn{left:3%}#en{right:3%}
#meter{position:absolute;top:18px;left:42%;width:16%;height:12px;border:1px solid white;border-radius:8px;overflow:hidden;background:#111}#uf{height:100%;width:0;background:#8b6cff}
#msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-weight:bold;text-align:center}
#joy{position:absolute;left:20px;bottom:25px;width:145px;height:145px;border:3px solid #fff5;border-radius:50%;background:#fff1;pointer-events:auto}#stick{position:absolute;left:44px;top:44px;width:54px;height:54px;border-radius:50%;background:#fff6}
.btn{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #fff9;background:#151932dd;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;pointer-events:auto}.a{right:102px;bottom:80px}.s{right:25px;bottom:148px}.d{right:180px;bottom:148px}.b{right:180px;bottom:70px}.u{right:25px;bottom:70px;background:#6049bddd}
#pause{position:absolute;right:12px;top:70px;pointer-events:auto;width:auto;margin:0;padding:8px 12px;font-size:12px}
#profile{position:absolute;left:15px;top:72px;font-size:12px;text-shadow:2px 2px #000}
</style></head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen">
<h1>ANIME ULTIMATE BATTLE</h1><h2>TEST RUN 2.0</h2>
<button onclick="start('STORY')">STORY MODE</button>
<button onclick="start('ULTIMATE')">ULTIMATE BATTLE — 5 TEAMS</button>
<button onclick="start('LOCAL')">MULTIPLAYER — OFFLINE</button>
<button onclick="start('ONLINE')">ONLINE BATTLE — TEST</button>
<button onclick="arena()">ARENA SELECT</button>
</div>

<div id="arena" class="screen hidden">
<h1>ARENA SELECT</h1>
<button onclick="chooseArena('NEXUS BATTLE ARENA')">1 • NEXUS BATTLE ARENA</button>
<button onclick="chooseArena('SPIRIT FOREST')">2 • SPIRIT FOREST</button>
<button onclick="chooseArena('NEO TOKYO')">3 • NEO TOKYO</button>
<button onclick="chooseArena('INFERNO CRATER')">4 • INFERNO CRATER</button>
<button onclick="chooseArena('FROZEN REALM')">5 • FROZEN REALM</button>
<button onclick="chooseArena('DESERT OF TITANS')">6 • DESERT OF TITANS</button>
<button onclick="chooseArena('SKY OCEAN')">7 • SKY OCEAN</button>
<button onclick="chooseArena('VOID DIMENSION')">8 • VOID DIMENSION</button>
<button onclick="chooseArena('ANCIENT WARRIOR TEMPLE')">9 • ANCIENT WARRIOR TEMPLE</button>
<button onclick="chooseArena('NEXUS CORE')">10 • NEXUS CORE</button>
<button onclick="backMenu()">BACK</button>
</div>

<div id="hud" class="hidden">
<div id="hp" class="bar"><div id="pf" style="width:100%"></div></div><div id="ehp" class="bar"><div id="ef" style="width:100%"></div></div>
<div id="pn" class="lab">MAX</div><div id="en" class="lab">NEXUS RIVAL</div><div id="meter"><div id="uf"></div></div>
<div id="msg">FIGHT!</div><div id="profile">LV 1 • XP 0 • RATING 1000</div>
<button id="pause" onclick="pauseGame()">MENU</button>
<div id="joy"><div id="stick"></div></div>
<div class="btn a" onclick="attack()">ATK</div><div class="btn s" onclick="special()">SPECIAL</div><div class="btn d" onclick="dodge()">DODGE</div><div class="btn b" onclick="block()">BLOCK</div><div class="btn u" onclick="ultimate()">ULTIMATE</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const canvas=document.getElementById("c"),eng=new BABYLON.Engine(canvas,true),scene=new BABYLON.Scene(eng);
scene.clearColor=new BABYLON.Color4(.01,.02,.06,1);
const cam=new BABYLON.ArcRotateCamera("camera",-Math.PI/2,1.05,24,new BABYLON.Vector3(0,2,0),scene);cam.inputs.clear();
new BABYLON.HemisphericLight("light",new BABYLON.Vector3(0,1,0),scene).intensity=1.1;
const pl=new BABYLON.PointLight("nexus",new BABYLON.Vector3(0,5,0),scene);pl.intensity=45;
function mat(n,h,e=false){let m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(h);if(e)m.emissiveColor=BABYLON.Color3.FromHexString(h);return m}
let floor=mat("floor","#26314a"), neon=mat("neon","#735dff",true), blue=mat("blue","#38bfff",true), ruin=mat("ruin","#12182b"), maxm=mat("max","#f4f4f4"), rival=mat("rival","#ff526b",true);
let ar=BABYLON.MeshBuilder.CreateCylinder("arena",{diameter:24,height:.7,tessellation:64},scene);ar.position.y=-.35;ar.material=floor;
[4,8,11].forEach(r=>{let t=BABYLON.MeshBuilder.CreateTorus("ring",{diameter:r*2,thickness:.12,tessellation:64},scene);t.rotation.x=Math.PI/2;t.material=neon});
for(let i=0;i<18;i++){let a=i*Math.PI*2/18,h=2+Math.random()*5,b=BABYLON.MeshBuilder.CreateBox("ruin",{width:1.5,depth:1.5,height:h},scene);b.position.set(Math.cos(a)*13,h/2-.2,Math.sin(a)*13);b.material=ruin}
let core=BABYLON.MeshBuilder.CreateSphere("core",{diameter:1.8},scene);core.position.y=2.5;core.material=blue;
function fighter(n,m,x,z){let b=BABYLON.MeshBuilder.CreateCapsule(n,{height:3,radius:.7},scene);b.position.set(x,1.5,z);b.material=m;return b}
let player=fighter("MAX",maxm,-3,2), enemy=fighter("RIVAL",rival,3,-2);
let hp=100,eh=100,ult=0,active=false,blocking=false,mode="",arenaName="NEXUS BATTLE ARENA",xp=0,level=1,rating=1000;
function msg(x){document.getElementById("msg").textContent=x}
function start(m){mode=m;document.getElementById("menu").classList.add("hidden");document.getElementById("arena").classList.add("hidden");document.getElementById("hud").classList.remove("hidden");active=true;msg(m+" • "+arenaName)}
function arena(){document.getElementById("menu").classList.add("hidden");document.getElementById("arena").classList.remove("hidden")}
function backMenu(){document.getElementById("arena").classList.add("hidden");document.getElementById("menu").classList.remove("hidden")}
function chooseArena(n){arenaName=n;msg("SELECTED: "+n);document.getElementById("arena").classList.add("hidden");document.getElementById("menu").classList.remove("hidden")}
function pauseGame(){active=false;document.getElementById("hud").classList.add("hidden");document.getElementById("menu").classList.remove("hidden")}
function attack(){if(!active)return;let d=10+Math.min(5,Math.floor(Math.random()*6));eh=Math.max(0,eh-d);ult=Math.min(100,ult+12);msg("COMBO ATTACK  -"+d);if(eh<=0)win()}
function special(){if(!active)return;eh=Math.max(0,eh-25);ult=Math.min(100,ult+22);msg("SPECIAL ATTACK!")}
function ultimate(){if(!active||ult<100)return;ult=0;eh=Math.max(0,eh-55);msg("MAX — NEXUS ULTIMATE!");if(eh<=0)win()}
function dodge(){if(active){player.position.x+=.9;setTimeout(()=>player.position.x-=.9,170);msg("DODGE!")}}
function block(){blocking=!blocking;msg(blocking?"BLOCKING":"BLOCK OFF")}
function win(){active=false;xp+=100;if(xp>=100){level++;xp=0}rating+=mode==="ONLINE"?25:0;msg("MAX WINS!  XP +100")}
let joy=document.getElementById("joy"),stick=document.getElementById("stick"),drag=false,jx=0,jy=0;
function jm(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-72,y=e.clientY-r.top-72,L=Math.hypot(x,y),m=50;if(L>m){x=x/L*m;y=y/L*m}jx=x/m;jy=y/m;stick.style.transform=`translate(${x}px,${y}px)`}
joy.addEventListener("pointerdown",e=>{drag=true;jm(e)});addEventListener("pointermove",e=>{if(drag)jm(e)});addEventListener("pointerup",()=>{drag=false;jx=jy=0;stick.style.transform="translate(0,0)"});
let keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
eng.runRenderLoop(()=>{if(active){player.position.x+=jx*.08;player.position.z+=jy*.08;if(keys.j)attack();if(keys.k)special();if(keys.l)ultimate();if(!blocking&&Math.random()<.003){hp=Math.max(0,hp-4);ult=Math.min(100,ult+2);if(hp<=0){active=false;msg("RIVAL WINS!")}}}core.rotation.y+=.02;document.getElementById("pf").style.width=hp+"%";document.getElementById("ef").style.width=eh+"%";document.getElementById("uf").style.width=ult+"%";document.getElementById("profile").textContent=`LV ${level} • XP ${xp} • RATING ${rating}`;scene.render()});
addEventListener("resize",()=>eng.resize());
</script></body></html>
